<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lujane yaffa</title>
<meta name="description" content="Websites, apps and paintings by Lujane Yaffa.">
<link rel="icon" type="image/png" href="media/favicon.png"><link rel="apple-touch-icon" href="media/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--page-bg);color:var(--page-ink);font-family:var(--body-font),system-ui,sans-serif;font-size:var(--base);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,.hd{font-family:var(--head-font),cursive;font-weight:400;line-height:1.05}
a{color:inherit}
img{display:block;max-width:100%}
.hero{background:var(--h-bg);color:var(--h-ink);padding:clamp(28px,6vw,64px) clamp(16px,5vw,64px) clamp(40px,8vw,88px);position:relative;overflow:hidden}
.hero nav{display:flex;gap:8px 18px;flex-wrap:wrap;font-weight:600;font-size:.9em;margin-bottom:clamp(36px,8vw,90px)}
.hero nav a{text-decoration:none;border-bottom:2px solid transparent}
.hero nav a:hover{border-color:currentColor}
.hero h1{font-size:calc(clamp(52px,12vw,150px)*var(--hs));color:var(--h-title);text-shadow:4px 4px 0 var(--h-ink);max-width:11ch;text-wrap:balance}
.hero p{font-size:1.25em;margin-top:18px;max-width:30ch;font-weight:500}
.sticker{position:absolute;right:clamp(16px,6vw,80px);bottom:clamp(20px,5vw,60px);width:clamp(96px,18vw,200px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:4px solid var(--h-ink);box-shadow:6px 6px 0 var(--h-ink);transform:rotate(8deg)}
.band{background:var(--bg);color:var(--ink);padding:clamp(40px,7vw,88px) clamp(16px,5vw,64px)}
.band .in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,64px);align-items:start}
.band.flip .in{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.band.flip .txt{order:2}
.band.nomedia .in{grid-template-columns:1fr;max-width:720px}
.txt{position:sticky;top:24px}
.logo{width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:14px;border:2px solid var(--line)}
.band h2{font-size:calc(clamp(34px,5.6vw,64px)*var(--hs));margin-bottom:14px}
.band .body{color:var(--ink);font-size:1.03em;max-width:46ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px;list-style:none;padding:0}
.tags li{font-size:.8em;font-weight:600;padding:4px 12px;border:1px solid var(--line);border-radius:99px;color:var(--mute)}
.go{display:inline-block;text-decoration:none;font-weight:700;padding:12px 22px;border:2px solid var(--btn);background:var(--btn);color:var(--btnInk);border-radius:10px;transition:transform .15s,opacity .15s}
.go.outline{background:transparent;color:var(--btn)}
.go:hover{transform:translateY(-2px);opacity:.92}
.go.nolink{cursor:default}
.media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2.4vw,28px)}
.shot{position:relative;background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden}
.shot img{width:100%;height:100%;aspect-ratio:4/3;object-fit:cover;object-position:top center}
.shot.big{grid-column:1/-1}
.shot.big img{aspect-ratio:auto;height:auto;object-fit:contain}
.shot.tall img{aspect-ratio:3/4}
.media .shot:last-of-type:nth-of-type(even){grid-column:1/-1}
.media .shot:last-of-type:nth-of-type(even) img{aspect-ratio:16/9}
.shot figcaption{padding:9px 14px;font-size:.82em;font-weight:600;color:var(--cardInk);border-top:1px solid var(--line);background:var(--card)}
.shot figcaption:empty{display:none}
.rec{position:absolute;top:10px;left:10px;background:#FF3B00;color:#fff;font-size:.72em;font-weight:700;padding:3px 10px;border-radius:99px;z-index:2;display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.rec:before{content:"";width:8px;height:8px;background:#fff;border-radius:50%}
.rec:empty{display:none}
.bubbles{max-width:1180px;margin:clamp(32px,5vw,56px) auto 0;padding-top:clamp(24px,4vw,40px);border-top:1px solid var(--line)}
.bubbles h3{font-family:var(--head-font),cursive;font-weight:400;font-size:calc(1.7em*var(--hs));display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.bubbles h3 small{font-family:var(--body-font),system-ui,sans-serif;font-size:.5em;color:var(--mute);font-weight:500}
.bub-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,2.4vw,28px)}
.bub{--bc:#eee;--bi:#333;position:relative;aspect-ratio:1;border-radius:50%;background:var(--bc);color:var(--bi);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%;overflow:hidden;cursor:default;animation:bob 5s ease-in-out infinite;transition:transform .45s cubic-bezier(.3,1.6,.5,1),box-shadow .3s,border-radius .6s}
.bub:nth-child(2){animation-delay:-1.2s}.bub:nth-child(3){animation-delay:-2.4s}.bub:nth-child(4){animation-delay:-3.6s}
.bub img{mix-blend-mode:multiply;width:56%;aspect-ratio:1;object-fit:contain;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.bub .nm{font-family:var(--head-font),cursive;font-size:calc(1.35em*var(--hs));margin-top:4px;transition:transform .4s}
.bub .tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14%;font-size:.86em;font-weight:600;line-height:1.35;opacity:0;transform:scale(.7) rotate(-6deg);transition:opacity .3s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.bub:hover,.bub:focus-within{animation-play-state:paused;transform:scale(1.07) rotate(-3deg);border-radius:46% 54% 52% 48%/52% 46% 54% 48%;box-shadow:0 14px 30px rgba(0,0,0,.18)}
.bub:hover img,.bub:focus-within img{transform:scale(1.35) rotate(10deg);opacity:.12}
.bub:hover .nm,.bub:focus-within .nm{transform:translateY(-120%);opacity:0}
.bub:hover .tx,.bub:focus-within .tx{opacity:1;transform:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@media(max-width:820px){.bub-row{grid-template-columns:repeat(2,minmax(0,1fr))}.bub .tx{opacity:1;transform:none;font-size:.78em}.bub img,.bub .nm{opacity:.0}}
@media(prefers-reduced-motion:reduce){.bub{animation:none}.bub,.bub *{transition:none}}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:28px clamp(16px,5vw,64px);font-weight:600;font-size:.9em}
footer a{opacity:.5;font-size:.85em}
@media(max-width:820px){
 .band .in,.band.flip .in{grid-template-columns:1fr}
 .band.flip .txt{order:0}
 .txt{position:static}
 .sticker{position:static;margin-top:28px;display:block}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.go{transition:none}}
</style>
<style id="editor-css"></style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const FALLBACK_FONT = "system-ui";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl = u => /^(https?:|mailto:|#|\/|media\/)/i.test(u||"") ? u : "";
window.SITE = null;

function loadFonts(t){
  const fams=[...new Set([t.headingFont,t.bodyFont])].filter(Boolean);
  const href="https://fonts.googleapis.com/css2?"+fams.map(f=>"family="+encodeURIComponent(f).replace(/%20/g,"+")+(f===t.bodyFont&&f!==t.headingFont?":wght@400;500;600;700":"")).join("&")+"&display=swap";
  let l=document.getElementById("gfonts");
  if(!l){l=document.createElement("link");l.id="gfonts";l.rel="stylesheet";document.head.appendChild(l)}
  if(l.href!==href) l.href=href;
}
function applyTheme(){
  const t=SITE.theme, r=document.documentElement.style;
  r.setProperty("--page-bg",t.pageBg); r.setProperty("--page-ink",t.pageInk);
  r.setProperty("--head-font",'"'+t.headingFont+'"'); r.setProperty("--body-font",'"'+t.bodyFont+'"');
  r.setProperty("--base",t.baseSize+"px"); r.setProperty("--hs",t.headScale||1);
  loadFonts(t);
}
function mediaHTML(si,mi,m){
  const cls="shot "+(m.kind||"grid");
  return `<figure class="${esc(cls)}" data-si="${si}" data-mi="${mi}"><span class="rec" data-path="sections.${si}.media.${mi}.badge">${esc(m.badge)}</span><img src="${esc(m.src)}" alt="${esc(m.alt)}" loading="lazy"><figcaption data-path="sections.${si}.media.${mi}.caption">${esc(m.caption)}</figcaption></figure>`;
}
function bubHTML(s,i){
  if(!s.bubbles||!s.bubbles.length) return "";
  return `<div class="bubbles"><h3><span data-path="sections.${i}.bubblesTitle">${esc(s.bubblesTitle||"")}</span><small data-path="sections.${i}.bubblesHint">${esc(s.bubblesHint||"")}</small></h3><div class="bub-row">`+
   s.bubbles.map((b,j)=>`<div class="bub" tabindex="0" style="--bc:${esc(b.color)};--bi:${esc(b.ink)}"><img src="${esc(b.img)}" alt=""><span class="nm" data-path="sections.${i}.bubbles.${j}.name">${esc(b.name)}</span><span class="tx" data-path="sections.${i}.bubbles.${j}.text">${esc(b.text)}</span></div>`).join("")+`</div></div>`;
}
function secHTML(s,i){
  const st=["bg","ink","mute","btn","btnInk","shadow","card","cardInk"].map(k=>`--${k}:${s[k]}`).join(";")+";--line:"+(s.line||"#c9c4bc");
  const url=safeUrl(s.button&&s.button.url);
  const bcls="go"+(s.button.style==="outline"?" outline":"")+(url?"":" nolink");
  const btn = s.button.label ? (url?`<a class="${bcls}" href="${esc(url)}" target="_blank" rel="noopener" data-path="sections.${i}.button.label">${esc(s.button.label)}</a>`:`<span class="${bcls}" data-path="sections.${i}.button.label">${esc(s.button.label)}</span>`) : "";
  const media=(s.media||[]).map((m,mi)=>mediaHTML(i,mi,m)).join("");
  return `<section class="band${s.flip?" flip":""}${media?"":" nomedia"}" id="${esc(s.id)}" style="${st}" data-si="${i}">
  <div class="in"><div class="txt">${s.logo?`<img class="logo" src="${esc(s.logo)}" alt="">`:""}
  <h2 data-path="sections.${i}.title">${esc(s.title)}</h2>
  <p class="body" data-path="sections.${i}.body">${esc(s.body)}</p>
  <ul class="tags" data-tags="${i}">${(s.tags||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul>${btn}</div>
  <div class="media">${media}</div></div>${bubHTML(s,i)}</section>`;
}
window.render=function(){
  applyTheme();
  const h=SITE.hero;
  const nav=h.showNav?`<nav>${SITE.sections.map(s=>`<a href="#${esc(s.id)}">${esc(s.nav||s.title)}</a>`).join("")}</nav>`:"";
  const hero=`<header class="hero" style="--h-bg:${h.bg};--h-ink:${h.ink};--h-title:${h.titleColor}">${nav}<h1 data-path="hero.title">${esc(h.title)}</h1><p data-path="hero.tagline">${esc(h.tagline)}</p>${h.showSticker&&h.sticker?`<img class="sticker" src="${esc(h.sticker)}" alt="">`:""}</header>`;
  document.getElementById("app").innerHTML=hero+SITE.sections.map(secHTML).join("")+
   `<footer style="background:var(--h-bg);color:var(--h-ink);--h-bg:${h.bg};--h-ink:${h.ink}"><span data-path="footer.left">${esc(SITE.footer.left)}</span><span><span data-path="footer.right">${esc(SITE.footer.right)}</span></span></footer>`;
  document.title=SITE.hero.title;
  if(window.Editor) Editor.decorate();
};
function gate(ok){
  const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const R=ls("ly_repo")||"lujaneyaffa/lujaneyaffa.github.io", T=ls("ly_token");
  const check=t=>fetch("https://api.github.com/repos/"+R,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"}}).then(r=>r.ok?r.json():null).then(j=>!!(j&&j.permissions&&j.permissions.push)).catch(()=>false);
  const form=msg=>{
    const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#FFF8EC;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font:500 16px Outfit,system-ui,sans-serif;color:#2B2420";
    d.innerHTML='<form style="max-width:380px;width:100%"><h2 style="font-family:Permanent Marker,cursive;font-weight:400;font-size:34px;margin-bottom:10px">owner only</h2><p style="margin-bottom:14px;color:#6E625A">'+(msg||"Paste the GitHub token to edit this site. Without it nothing can be changed.")+'</p><input type="password" placeholder="github_pat_..." style="width:100%;padding:10px;border:2px solid #c9c4bc;border-radius:8px;font:inherit;margin-bottom:10px"><button style="padding:10px 18px;border:0;border-radius:8px;background:#2B2420;color:#FFF8EC;font:inherit;font-weight:700;cursor:pointer">unlock</button> <a href="./" style="margin-left:10px;color:#6E625A">back to the site</a></form>';
    document.body.appendChild(d);
    d.querySelector("form").onsubmit=async e=>{e.preventDefault();const t=d.querySelector("input").value.trim();d.querySelector("button").textContent="checking…";
      if(await check(t)){try{localStorage.setItem("ly_token",t)}catch(x){}d.remove();ok()}else{d.remove();form("That token doesn't have write access to this site.")}};
  };
  if(T){check(T).then(g=>{if(g)ok();else form("Your saved token no longer works. Paste a new one.")})}else form();
}
function boot(){
  const wantEdit=/[?&]edit\b/.test(location.search);
  fetch("site.json?"+Date.now()).then(r=>r.json()).then(d=>{
    SITE=d;
    render();
    if(wantEdit) gate(()=>{const s=document.createElement("script");s.src="editor.js?"+Date.now();document.body.appendChild(s)});
  }).catch(e=>{document.getElementById("app").textContent="Could not load site.json"});
}
boot();
})();
</script>
</body>
</html>
