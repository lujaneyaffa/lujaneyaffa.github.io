<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lujane yaffa</title>
<meta name="description" content="Websites, apps and paintings by Lujane Yaffa.">
<link rel="icon" href="media/darvr-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--page-bg);color:var(--page-ink);font-family:var(--body-font),system-ui,sans-serif;font-size:var(--base);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,.hd{font-family:var(--head-font),cursive;font-weight:400;line-height:1.05}
a{color:inherit}
img{display:block;max-width:100%}
.hero{background:var(--h-bg);color:var(--h-ink);padding:clamp(28px,6vw,64px) clamp(16px,5vw,64px) clamp(40px,8vw,88px);position:relative;overflow:hidden}
.hero nav{display:flex;gap:8px 18px;flex-wrap:wrap;font-weight:600;font-size:.9em;margin-bottom:clamp(36px,8vw,90px)}
.hero nav a{text-decoration:none;border-bottom:2px solid transparent}
.hero nav a:hover{border-color:currentColor}
.hero h1{font-size:calc(clamp(52px,12vw,150px)*var(--hs));color:var(--h-title);text-shadow:4px 4px 0 var(--h-ink);max-width:11ch;text-wrap:balance}
.hero p{font-size:1.25em;margin-top:18px;max-width:30ch;font-weight:500}
.sticker{position:absolute;right:clamp(16px,6vw,80px);bottom:clamp(20px,5vw,60px);width:clamp(96px,18vw,200px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:4px solid var(--h-ink);box-shadow:6px 6px 0 var(--h-ink);transform:rotate(8deg)}
.band{background:var(--bg);color:var(--ink);padding:clamp(40px,7vw,88px) clamp(16px,5vw,64px)}
.band .in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,64px);align-items:start}
.band.flip .in{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.band.flip .txt{order:2}
.band.nomedia .in{grid-template-columns:1fr;max-width:720px}
.txt{position:sticky;top:24px}
.logo{width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:14px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--shadow)}
.band h2{font-size:calc(clamp(34px,5.6vw,64px)*var(--hs));margin-bottom:14px}
.band .body{color:var(--ink);font-size:1.03em;max-width:46ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px;list-style:none;padding:0}
.tags li{font-size:.8em;font-weight:600;padding:4px 12px;border:2px solid var(--ink);border-radius:99px;color:var(--mute);border-color:var(--mute)}
.go{display:inline-block;text-decoration:none;font-weight:700;padding:12px 22px;border:3px solid var(--btn);background:var(--btn);color:var(--btnInk);box-shadow:5px 5px 0 var(--shadow);border-radius:6px;transition:transform .12s,box-shadow .12s}
.go.outline{background:transparent;color:var(--btn)}
.go:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--shadow)}
.go.nolink{cursor:default}
.media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2.4vw,28px)}
.shot{position:relative;background:var(--card);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--shadow);border-radius:8px;overflow:visible;padding:0}
.shot img{width:100%;border-radius:5px;height:auto}
.shot.big{grid-column:1/-1}
.shot figcaption{padding:8px 12px;font-size:.82em;font-weight:600;color:var(--cardInk)}
.shot figcaption:empty{display:none}
.rec{position:absolute;top:-12px;left:14px;background:#FF3B00;color:#fff;font-size:.72em;font-weight:700;padding:3px 10px;border-radius:99px;z-index:2;display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.rec:before{content:"";width:8px;height:8px;background:#fff;border-radius:50%}
.rec:empty{display:none}
.tilt .shot:not(.big):nth-child(even){transform:rotate(1.4deg)}
.tilt .shot:not(.big):nth-child(odd){transform:rotate(-1.2deg)}
.shot.tall img{aspect-ratio:3/4;object-fit:cover}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:28px clamp(16px,5vw,64px);font-weight:600;font-size:.9em}
footer a{opacity:.5;font-size:.85em}
@media(max-width:820px){
 .band .in,.band.flip .in{grid-template-columns:1fr}
 .band.flip .txt{order:0}
 .txt{position:static}
 .sticker{position:static;margin-top:28px;display:block}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.go{transition:none}}
</style>
<style id="editor-css"></style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const FALLBACK_FONT = "system-ui";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl = u => /^(https?:|mailto:|#|\/|media\/)/i.test(u||"") ? u : "";
window.SITE = null;

function loadFonts(t){
  const fams=[...new Set([t.headingFont,t.bodyFont])].filter(Boolean);
  const href="https://fonts.googleapis.com/css2?"+fams.map(f=>"family="+encodeURIComponent(f).replace(/%20/g,"+")+(f===t.bodyFont&&f!==t.headingFont?":wght@400;500;600;700":"")).join("&")+"&display=swap";
  let l=document.getElementById("gfonts");
  if(!l){l=document.createElement("link");l.id="gfonts";l.rel="stylesheet";document.head.appendChild(l)}
  if(l.href!==href) l.href=href;
}
function applyTheme(){
  const t=SITE.theme, r=document.documentElement.style;
  r.setProperty("--page-bg",t.pageBg); r.setProperty("--page-ink",t.pageInk);
  r.setProperty("--head-font",'"'+t.headingFont+'"'); r.setProperty("--body-font",'"'+t.bodyFont+'"');
  r.setProperty("--base",t.baseSize+"px"); r.setProperty("--hs",t.headScale||1);
  loadFonts(t);
}
function mediaHTML(si,mi,m){
  const cls="shot "+(m.kind||"grid");
  return `<figure class="${esc(cls)}" data-si="${si}" data-mi="${mi}"><span class="rec" data-path="sections.${si}.media.${mi}.badge">${esc(m.badge)}</span><img src="${esc(m.src)}" alt="${esc(m.alt)}" loading="lazy"><figcaption data-path="sections.${si}.media.${mi}.caption">${esc(m.caption)}</figcaption></figure>`;
}
function secHTML(s,i){
  const st=["bg","ink","mute","btn","btnInk","shadow","card","cardInk"].map(k=>`--${k}:${s[k]}`).join(";");
  const url=safeUrl(s.button&&s.button.url);
  const bcls="go"+(s.button.style==="outline"?" outline":"")+(url?"":" nolink");
  const btn = s.button.label ? (url?`<a class="${bcls}" href="${esc(url)}" target="_blank" rel="noopener" data-path="sections.${i}.button.label">${esc(s.button.label)}</a>`:`<span class="${bcls}" data-path="sections.${i}.button.label">${esc(s.button.label)}</span>`) : "";
  const media=(s.media||[]).map((m,mi)=>mediaHTML(i,mi,m)).join("");
  return `<section class="band${s.flip?" flip":""}${media?"":" nomedia"}" id="${esc(s.id)}" style="${st}" data-si="${i}">
  <div class="in"><div class="txt">${s.logo?`<img class="logo" src="${esc(s.logo)}" alt="">`:""}
  <h2 data-path="sections.${i}.title">${esc(s.title)}</h2>
  <p class="body" data-path="sections.${i}.body">${esc(s.body)}</p>
  <ul class="tags" data-tags="${i}">${(s.tags||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul>${btn}</div>
  <div class="media${SITE.theme.tilt?" tilt":""}">${media}</div></div></section>`;
}
window.render=function(){
  applyTheme();
  const h=SITE.hero;
  const nav=h.showNav?`<nav>${SITE.sections.map(s=>`<a href="#${esc(s.id)}">${esc(s.nav||s.title)}</a>`).join("")}</nav>`:"";
  const hero=`<header class="hero" style="--h-bg:${h.bg};--h-ink:${h.ink};--h-title:${h.titleColor}">${nav}<h1 data-path="hero.title">${esc(h.title)}</h1><p data-path="hero.tagline">${esc(h.tagline)}</p>${h.showSticker&&h.sticker?`<img class="sticker" src="${esc(h.sticker)}" alt="">`:""}</header>`;
  document.getElementById("app").innerHTML=hero+SITE.sections.map(secHTML).join("")+
   `<footer style="background:var(--h-bg);color:var(--h-ink);--h-bg:${h.bg};--h-ink:${h.ink}"><span data-path="footer.left">${esc(SITE.footer.left)}</span><span><span data-path="footer.right">${esc(SITE.footer.right)}</span> <a href="?edit" id="editlink">edit</a></span></footer>`;
  document.title=SITE.hero.title;
  if(window.Editor) Editor.decorate();
};
function boot(){
  const wantEdit=/[?&]edit\b/.test(location.search);
  fetch("site.json?"+Date.now()).then(r=>r.json()).then(d=>{
    SITE=d;
    render();
    if(wantEdit){const s=document.createElement("script");s.src="editor.js?"+Date.now();document.body.appendChild(s)}
  }).catch(e=>{document.getElementById("app").textContent="Could not load site.json"});
}
boot();
})();
</script>
</body>
</html>
